<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2" />

  <!-- Company / Factory Building Vector -->
  <g transform="translate(24, 25)">
    <!-- Base Building -->
    <rect x="8" y="26" width="34" height="42" rx="3" fill="#0284C7" fill-opacity="0.12" stroke="#0284C7" stroke-width="2.5" />
    
    <!-- Left Windows -->
    <rect x="14" y="34" width="6" height="6" rx="1" fill="#0284C7" />
    <rect x="24" y="34" width="6" height="6" rx="1" fill="#0284C7" />
    <rect x="34" y="34" width="6" height="6" rx="1" fill="#0284C7" />
    
    <rect x="14" y="44" width="6" height="6" rx="1" fill="#0284C7" />
    <rect x="24" y="44" width="6" height="6" rx="1" fill="#0284C7" />
    <rect x="34" y="44" width="6" height="6" rx="1" fill="#0284C7" />

    <!-- Building Entrance Door -->
    <path d="M22 68V56H28V68" stroke="#0284C7" stroke-width="2.5" fill="#0284C7" fill-opacity="0.3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Tower / Higher Block -->
    <path d="M42 36L42 16C42 14.3431 43.3431 13 45 13H61C62.6569 13 64 14.3431 64 16V68H42" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="2.5" />
    
    <!-- Right Windows -->
    <rect x="48" y="20" width="5" height="5" rx="1" fill="#16A34A" />
    <rect x="55" y="20" width="5" height="5" rx="1" fill="#16A34A" />

    <rect x="48" y="29" width="5" height="5" rx="1" fill="#16A34A" />
    <rect x="55" y="29" width="5" height="5" rx="1" fill="#16A34A" />

    <rect x="48" y="38" width="5" height="5" rx="1" fill="#16A34A" />
    <rect x="55" y="38" width="5" height="5" rx="1" fill="#16A34A" />

    <rect x="48" y="47" width="5" height="5" rx="1" fill="#16A34A" />
    <rect x="55" y="47" width="5" height="5" rx="1" fill="#16A34A" />

    <!-- Environmental / Leaf Badge on top left -->
    <g transform="translate(2, 6)">
      <circle cx="10" cy="10" r="10" fill="#16A34A" />
      <!-- Stylized Leaf -->
      <path d="M7 13C7 9 10 7 14 7C14 11 11 14 7 14V13Z" fill="white" />
      <path d="M7 13L11 9" stroke="white" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Ground Line -->
    <line x1="2" y1="68" x2="70" y2="68" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
