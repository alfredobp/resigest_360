name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta todos los lunes a las 09:00 AM
    - cron: '0 9 * * 1'
  workflow_dispatch: # Permite ejecutarlo manualmente si quieres probarlo

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"